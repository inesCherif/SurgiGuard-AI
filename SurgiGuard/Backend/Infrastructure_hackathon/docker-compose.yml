version: "3.8"

services:
  # MongoDB - Dernière version LTS
  mongo:
    image: mongo:7.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodbdata:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Local MQTT broker: stands in for the EMQX cloud broker when there is no ESP32
  # (scripts/simulate_device_mqtt.py publishes the firmware's exact JSON on Hackcure/data)
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  # API REST .NET 8
  api:
    build: ../API
    container_name: api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - MongoDbSettings__ConnectionString=mongodb://admin:admin123@mongo:27017
      - MongoDbSettings__DatabaseName=${MONGO_DB:-DB}
      - EnableSwagger=true
      - Jwt__Key=${JWT_KEY:-hackathon-change-me-please-32-chars-min!!}
      - ServiceApiKeys__Iot=${IOT_API_KEY:-dev-iot-key}
      - ServiceApiKeys__Agents=${AGENTS_API_KEY:-dev-agents-key}
      - WhatsApp__Enabled=${WHATSAPP_ENABLED:-false}
      - WhatsApp__PhoneNumberId=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WhatsApp__AccessToken=${WHATSAPP_ACCESS_TOKEN:-}
      - WhatsApp__TemplateName=${WHATSAPP_TEMPLATE_NAME:-}
      - Firebase__Enabled=${FIREBASE_ENABLED:-false}
      # MQTT: local broker by default (MQTT_BROKER=h1211a42.ala.eu-central-1.emqxsl.com MQTT_PORT=8883 MQTT_TLS=true for the real board)
      - Mqtt__Enabled=${MQTT_ENABLED:-true}
      - Mqtt__Broker=${MQTT_BROKER:-mqtt}
      - Mqtt__Port=${MQTT_PORT:-1883}
      - Mqtt__UseTls=${MQTT_TLS:-false}
      # Assistant IA FastAPI lancé sur la machine hôte (AppMobile/backend, port 8000)
      - ChatService__BaseUrl=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

volumes:
  mongodbdata:
